name: gitpulse
options:
  bundleIdPrefix: com.chenbitao.gitpulse
  deploymentTarget:
    iOS: "17.4"
fileGroups: [../../src, ../../widgets]
settings:
  base:
    SWIFT_VERSION: "5.9"
    GITPULSE_APP_GROUP: group.com.chenbitao.gitpulse
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "0.0.1"
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: gitpulse
      PRODUCT_BUNDLE_IDENTIFIER: com.chenbitao.gitpulse
      CODE_SIGN_STYLE: Automatic
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  gitpulse_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../../widgets/ios/Host
        excludes: ["*.entitlements"]
      - path: ../../widgets/ios/Shared
      - path: Assets.xcassets
      # Exclude built static libs: regenerating with xcodegen after a build
      # otherwise turns the per-configuration libapp.a copies into colliding
      # resources ("Multiple commands produce …/libapp.a"). They are linked
      # via LIBRARY_SEARCH_PATHS, never bundled as resources.
      - path: Externals
        excludes: ["**/*.a"]
      - path: gitpulse_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: gitpulse_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        GitPulseAppGroup: $(GITPULSE_APP_GROUP)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    entitlements:
      path: gitpulse_iOS/gitpulse_iOS.entitlements
      properties:
        com.apple.security.application-groups: ["$(GITPULSE_APP_GROUP)"]
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - target: GitPulseWidgetsExtension
        embed: true
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    preBuildScripts:
      - script: |
          pnpm tauri ios xcode-script -v --platform "${PLATFORM_DISPLAY_NAME:?}" --sdk-root "${SDKROOT:?}" --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration "${CONFIGURATION:?}" ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a

  GitPulseWidgetsExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: ../../widgets/ios/Shared
      - path: ../../widgets/ios/Extension
        excludes: ["*.entitlements", "Info.plist"]
    info:
      path: ../../widgets/ios/Extension/Info.plist
      properties:
        CFBundleDisplayName: GitPulse
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GitPulseAppGroup: $(GITPULSE_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ../../widgets/ios/Extension/Widgets.entitlements
      properties:
        com.apple.security.application-groups: ["$(GITPULSE_APP_GROUP)"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chenbitao.gitpulse.widgets
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
