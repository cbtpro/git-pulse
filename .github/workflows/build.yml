name: Build all platforms

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to package
        type: choice
        default: all
        options: [all, desktop, android, ios, web]
      publish:
        description: Publish the current version after all platforms pass
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: false

env:
  CI: "true"
  VITE_GITHUB_CLIENT_ID: ${{ vars.VITE_GITHUB_CLIENT_ID }}
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check and build web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check OAuth configuration
        run: node scripts/ci/check-config.mjs
      - name: Validate release selection
        if: inputs.publish && inputs.platform != 'all'
        run: |
          echo 'Publishing requires platform=all.' >&2
          exit 1
      - run: pnpm check
      - run: pnpm -F @gitpulse/app build:web
      - uses: actions/upload-artifact@v4
        with:
          name: gitpulse-web
          path: packages/app/dist
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: check
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'desktop'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macos-x64
            os: macos-15
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri -> target
          key: desktop-${{ matrix.target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev libxdo-dev
      - name: Install Windows assembler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --yes --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: pnpm install --frozen-lockfile
      - name: Package desktop app
        env:
          # Ad-hoc signing allows unsigned Apple Silicon builds to launch locally.
          APPLE_SIGNING_IDENTITY: "-"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm -F @gitpulse/app tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Collect installers and checksums
        run: node scripts/ci/collect-artifacts.mjs desktop ${{ matrix.name }} packages/app/src-tauri/target/${{ matrix.target }}/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: gitpulse-${{ matrix.name }}
          path: artifacts/${{ matrix.name }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  android:
    name: Android (all ABIs)
    needs: check
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NDK_VERSION: 27.2.12479018
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install NDK
        run: |
          sdkmanager "ndk;$NDK_VERSION" "build-tools;36.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri -> target
          key: android
      - run: pnpm install --frozen-lockfile
      - name: Initialize Android project
        run: pnpm -F @gitpulse/app tauri android init --ci --skip-targets-install
      - name: Restore Android app icons
        run: node scripts/dev/sync-icons.mjs android
      - name: Configure generated project and optional signing
        id: prepare
        run: node scripts/ci/prepare-android.mjs
      - name: Install Android SDKs for app and library modules
        env:
          PLATFORM_PACKAGES: ${{ steps.prepare.outputs.platform-packages }}
        run: |
          read -r -a packages <<< "$PLATFORM_PACKAGES"
          sdkmanager "${packages[@]}"
      - name: Package APK and AAB for all four ABIs
        run: pnpm -F @gitpulse/app tauri android build --ci --apk --aab --target aarch64 armv7 i686 x86_64
      - name: Collect Android packages
        env:
          SIGNING: ${{ steps.prepare.outputs.signing }}
        run: node scripts/ci/collect-artifacts.mjs android "android-$SIGNING" packages/app/src-tauri/gen/android/app/build/outputs
      - uses: actions/upload-artifact@v4
        with:
          name: gitpulse-android-${{ steps.prepare.outputs.signing }}
          path: artifacts/android-${{ steps.prepare.outputs.signing }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/gitpulse-release.keystore"

  ios:
    name: iOS (${{ matrix.name }})
    needs: check
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'ios'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: device-arm64
            target: aarch64
            rust-target: aarch64-apple-ios
          - name: simulator-arm64
            target: aarch64-sim
            rust-target: aarch64-apple-ios-sim
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri -> target
          key: ios-${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Prepare Xcode project
        shell: bash
        run: |
          if [[ -f packages/app/src-tauri/gen/apple/project.yml ]]; then
            mkdir -p packages/app/src-tauri/gen/apple/Externals packages/app/src-tauri/gen/apple/assets
            # The host CLI applies --build-number only to its own target.
            # Set the shared value so the embedded widget has the same version.
            node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'packages/app/src-tauri/gen/apple/project.yml';
          const { version } = JSON.parse(readFileSync('packages/app/package.json', 'utf8'));
          const build = `${version}.${process.env.GITHUB_RUN_NUMBER}`;
          writeFileSync(path, readFileSync(path, 'utf8').replace(/CURRENT_PROJECT_VERSION: "[^"]+"/, `CURRENT_PROJECT_VERSION: "${build}"`));
          NODE
            xcodegen generate --spec packages/app/src-tauri/gen/apple/project.yml
          else
            pnpm -F @gitpulse/app tauri ios init --ci --skip-targets-install
          fi
          node scripts/dev/sync-icons.mjs ios
      - name: Package iOS app
        id: package
        shell: bash
        env:
          IOS_TARGET: ${{ matrix.target }}
          IOS_CERTIFICATE: ${{ matrix.target == 'aarch64' && secrets.IOS_CERTIFICATE || '' }}
          IOS_CERTIFICATE_PASSWORD: ${{ matrix.target == 'aarch64' && secrets.IOS_CERTIFICATE_PASSWORD || '' }}
          IOS_MOBILE_PROVISION: ${{ matrix.target == 'aarch64' && secrets.IOS_MOBILE_PROVISION || '' }}
          IOS_WIDGET_MOBILE_PROVISION: ${{ matrix.target == 'aarch64' && secrets.IOS_WIDGET_MOBILE_PROVISION || '' }}
          APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_DEVELOPMENT_TEAM }}
          IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'debugging' }}
        run: |
          args=(--ci --target "$IOS_TARGET" --build-number "$GITHUB_RUN_NUMBER")
          signing=unsigned
          if [[ -n "$IOS_CERTIFICATE$IOS_CERTIFICATE_PASSWORD$IOS_MOBILE_PROVISION$IOS_WIDGET_MOBILE_PROVISION" ]]; then
            if [[ -z "$IOS_CERTIFICATE" || -z "$IOS_CERTIFICATE_PASSWORD" || -z "$IOS_MOBILE_PROVISION" || -z "$IOS_WIDGET_MOBILE_PROVISION" || -z "$APPLE_DEVELOPMENT_TEAM" ]]; then
              echo 'Configure all iOS signing secrets and APPLE_DEVELOPMENT_TEAM together.' >&2
              exit 1
            fi
            node scripts/ci/prepare-ios-widgets.mjs
            args+=(--export-method "$IOS_EXPORT_METHOD")
            signing=signed
          else
            if [[ "$IOS_TARGET" == 'aarch64' ]]; then
              args+=(--no-sign)
            else
              # Keep Xcode's local simulator signature for App Groups/Keychain.
              signing=simulator-local
            fi
            unset IOS_CERTIFICATE IOS_CERTIFICATE_PASSWORD IOS_MOBILE_PROVISION
          fi
          # An absent optional team is valid for unsigned builds; an empty value is not.
          if [[ -z "$APPLE_DEVELOPMENT_TEAM" ]]; then
            unset APPLE_DEVELOPMENT_TEAM
          fi
          pnpm -F @gitpulse/app tauri ios build "${args[@]}"
          echo "signing=$signing" >> "$GITHUB_OUTPUT"
      - name: Collect iOS package
        env:
          ARTIFACT_LABEL: ios-${{ matrix.name }}-${{ steps.package.outputs.signing }}
          PACKAGE_KIND: ${{ matrix.target == 'aarch64' && 'ios' || 'simulator' }}
        run: node scripts/ci/collect-artifacts.mjs "$PACKAGE_KIND" "$ARTIFACT_LABEL" packages/app/src-tauri/gen/apple/build
      - uses: actions/upload-artifact@v4
        with:
          name: gitpulse-ios-${{ matrix.name }}-${{ steps.package.outputs.signing }}
          path: artifacts/ios-${{ matrix.name }}-${{ steps.package.outputs.signing }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish release
    needs: [check, desktop, android, ios]
    if: startsWith(github.ref, 'refs/tags/v') || (inputs.publish && inputs.platform == 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/release-input
          pattern: gitpulse-*
      - name: Package downloads and checksums
        shell: bash
        run: |
          mkdir -p artifacts/release
          destination="$PWD/artifacts/release"
          for directory in artifacts/release-input/*; do
            name=$(basename "$directory")
            (cd "$directory" && zip -q -r "$destination/$name.zip" .)
          done
          cd artifacts/release
          sha256sum ./*.zip > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            tag="v$(node -p "require('./packages/app/package.json').version")"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag"; then
              echo "Tag $tag already exists; refusing to replace it." >&2
              exit 1
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$tag" "$GITHUB_SHA" -m "GitPulse $tag"
            git push origin "refs/tags/$tag"
          fi
          notes="docs/releases/$tag.md"
          args=(--verify-tag --title "GitPulse $tag")
          if [[ -f "$notes" ]]; then
            args+=(--notes-file "$notes")
          else
            args+=(--generate-notes)
          fi
          gh release create "$tag" artifacts/release/* "${args[@]}"
